name: Procura release gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-tests:
    name: contracts/tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --basetemp .pytest-tmp-ci

  security-adversarial:
    name: security/adversarial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m adversarial -q --basetemp .pytest-tmp-ci
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.(pem|key)$|.*keystore.*|.*credentials.*|.*password.*|.*secret.*)$'; then
            echo 'Sensitive tracked filename found' >&2
            exit 1
          fi
          if rg -n --hidden -g '!.git' -g '!frontend/node_modules' -g '!frontend/dist' \
            -e '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' \
            -e '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' .; then
            echo 'Secret-like material found' >&2
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run
      - run: pnpm typecheck
      - run: pnpm build

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/contract tests/qualification -q --basetemp .pytest-tmp-ci

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  build-provenance:
    name: build/provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen release provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(sha256sum contracts/Procura.py | cut -d' ' -f1)" = "daad9b0c43be603e522afbf55623e7b8027d7de3b01708922360ae5a45972cde"
          test "$(rg -c '^    def ' contracts/Procura.py | awk -F: '{s+=$2} END {print s+0}')" -ge 0
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('evidence/release-provenance.json').read_text())
          assert manifest['canonicalContract'] == '0x88634c7868B0659b46C5bd93E4038222697a0170'
          assert manifest['chainId'] == 61997
          assert manifest['publicMethodCount'] == 39
          assert manifest['contractSha256'] == 'daad9b0c43be603e522afbf55623e7b8027d7de3b01708922360ae5a45972cde'
          PY
