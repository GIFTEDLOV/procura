name: Procura release gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-tests:
    name: contracts/tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --basetemp .pytest-tmp-ci
      - run: python scripts/check_steward_v212_schema.py

  security-adversarial:
    name: security/adversarial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m adversarial -q --basetemp .pytest-tmp-ci
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.(pem|key)$|.*keystore.*|.*credentials.*|.*password.*|.*secret.*)$'; then
            echo 'Sensitive tracked filename found' >&2
            exit 1
          fi
          if rg -n --hidden -g '!.git' -g '!frontend/node_modules' -g '!frontend/dist' \
            -e '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' \
            -e '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' .; then
            echo 'Secret-like material found' >&2
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run
      - run: pnpm typecheck
      - run: pnpm build
      - run: node ../scripts/qualification/transaction-safety.test.mjs

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/contract tests/qualification -q --basetemp .pytest-tmp-ci

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  build-provenance:
    name: build/provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen release provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || test "${GITHUB_EVENT_NAME}" = "pull_request"
          # Keep the V1 and V2.1.2 sources/proofs immutable while requiring V3 Milestone features.
          test "$(sha256sum contracts/Procura_v1_frozen.py | cut -d' ' -f1)" = "daad9b0c43be603e522afbf55623e7b8027d7de3b01708922360ae5a45972cde"
          test "$(sha256sum contracts/Procura_studionet_v2_1_2.py | cut -d' ' -f1)" = "a74ae78774ea37d06af2b509d5c728d18c8f9a640a539a2f3575a17e1a28fdac"
          test "$(sha256sum contracts/Procura.py | cut -d' ' -f1)" = "e175eded7e5cacb4f2773ca25657195cb662f88bb532df3eab76e8092691be78"
          python scripts/check_steward_v212_schema.py
          python - <<'PY'
          import json
          from pathlib import Path
          current = json.loads(Path('evidence/release-provenance.json').read_text())
          historical = json.loads(Path('evidence/qualification/historical/release-provenance-studio-dev-v1.json').read_text())
          assert historical['canonicalContract'] == '0x88634c7868B0659b46C5bd93E4038222697a0170'
          assert historical['chainId'] == 61997
          assert historical['contractSha256'] == 'daad9b0c43be603e522afbf55623e7b8027d7de3b01708922360ae5a45972cde'
          assert current['network'] == 'studionet'
          assert current['chainId'] == 61999
          assert current['rpc'] == 'https://studio.genlayer.com/api'
          assert current['canonicalContract'] == '0xE8b7FCD95FA54B442e3ed114D6Cb1a016774b929'
          deployment = current['deployment']
          assert deployment['reusedExisting'] is True
          assert deployment['countThisQualification'] == 0
          assert deployment['canonicalContract'] == current['canonicalContract']
          assert deployment['deploymentTx'] == '0x82cc2deec80db1f383200ad46e8c1062a64108782eced48a7ad7fc9e49f7ec33'
          assert deployment['consensusStatus'] == 'FINALIZED'
          assert deployment['consensusResult'] == 'MAJORITY_AGREE'
          assert deployment['evmReceiptStatus'] == '0x1'
          assert deployment['sourceParity'] is True
          assert current['contractSha256'] == 'a74ae78774ea37d06af2b509d5c728d18c8f9a640a539a2f3575a17e1a28fdac'
          assert current['schemaSha256'] == '21a63012d333ccb2e29c4cd799034c42b2183f7831f64e61157e75d85bbd1127'
          assert current['abiSha256'] == '97015697a9252c5c2b86f4e72d76a926775eca14ec7add6c743ece0609edd800'
          assert current['interfaceSha256'] == 'b32e4393d90962f366a34bfcf6a7e373f324776ba7c95fb6c61a601cf9cdd01f'
          assert current['qualification']['status'] == 'PASS'
          qualification = current['qualification']
          expected = ['create_tender', 'add_requirement', 'freeze_tender', 'fund_tender', 'submit_bid', 'add_bid_evidence', 'begin_bid_evaluation', 'adjudicate_requirement', 'finalize_bid_evaluation', 'award_bid', 'accept_award', 'create_delivery', 'add_delivery_evidence']
          transactions = qualification['transactions']
          assert [tx['method'] for tx in transactions] == expected
          assert qualification['transactionCount'] == len(expected)
          assert qualification['allTransactionsFinalized'] is True
          assert qualification['allTransactionsMajorityAgreed'] is True
          assert qualification['allExecutionsSuccessful'] is True
          assert qualification['allEvmReceiptsSuccessful'] is True
          assert all(tx['consensusStatus'] == 'FINALIZED' and tx['consensusResult'] == 'MAJORITY_AGREE' for tx in transactions)
          assert all(tx['executionOutcome']['leader'] == 'SUCCESS' and tx['executionOutcome']['validatorsExecutedSuccessfully'] >= 2 for tx in transactions)
          assert all(tx['evmReceiptStatus'] == '0x1' for tx in transactions)
          assert sum(int(tx['actualGenFeeWei']) for tx in transactions) == 0
          assert sum(int(tx['actualDebitWei']) for tx in transactions) == 100000000000000
          readback = qualification['canonicalReadback']
          assert readback['adjudication']['canonical_verdict'] == 'COMPLIANT'
          assert readback['adjudication']['evidence_sufficient'] is True
          assert readback['award']['state'] == 'ACCEPTED'
          assert readback['delivery']['state'] == 'DELIVERED'
          assert len(readback['deliveryEvidence']) >= 1
          assert readback['accounting']['escrow_liability'] == 300000000000000
          proof_text = Path('docs/LIVE_PROOFS.md').read_text()
          for tx in transactions:
              hash_value = tx['submissionHash']
              assert f'[{hash_value}](https://explorer-studio.genlayer.com/tx/{hash_value})' in proof_text
          assert 'evidence/release-provenance.json' in Path('README.md').read_text()
          PY
